<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080d">
  <title>Victory | Secret Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stadium" aria-hidden="true">
    <div class="vignette"></div>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="track-perspective">
      <div class="track-lane lane-one"></div>
      <div class="track-lane lane-two"></div>
      <div class="track-lane lane-three"></div>
      <div class="track-lane lane-four"></div>
      <div class="track-sweep"></div>
    </div>
    <div class="beam beam-left"></div>
    <div class="beam beam-right"></div>
    <div class="stadium-lights lights-left"></div>
    <div class="stadium-lights lights-right"></div>
    <div class="fog fog-one"></div>
    <div class="fog fog-two"></div>
    <div class="particles" id="particles"></div>
    <div class="cursor-spotlight" id="cursorSpotlight"></div>
  </div>

  <main class="secret-stage">
    <section class="intro" aria-label="Secret victory page introduction">
      <p class="eyebrow">Victory Archive</p>
      <h1>You have reached the secret page of Nithu <span aria-label="heart">❤️</span></h1>
      <p class="subtitle">Only a few people ever discover this page.</p>
    </section>

    <section class="gallery-shell" id="galleryShell" aria-label="Victory photo slideshow">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="photo-card" id="photoCard">
        <div class="reflection" aria-hidden="true"></div>
        <div class="slides" id="slides">
          <figure class="slide active">
            <img src="jai-ni.jpeg" alt="Nithu celebrating a victorious moment" draggable="false">
          </figure>
          <figure class="slide">
            <img src="jai-ni2.jpeg" alt="Nithu smiling in a memorable victory photo" draggable="false">
          </figure>
          <figure class="slide">
            <img src="jai-ni3.jpeg" alt="Nithu captured in a joyful secret-page memory" draggable="false">
          </figure>
          <figure class="slide">
            <img src="jai-ni4.jpeg" alt="Nithu in a special photo from the hidden victory collection" draggable="false">
          </figure>
        </div>
      </div>

      <div class="slide-indicators" id="slideIndicators" aria-label="Slideshow position">
        <button class="indicator active" type="button" aria-label="Show photo 1" aria-current="true"></button>
        <button class="indicator" type="button" aria-label="Show photo 2"></button>
        <button class="indicator" type="button" aria-label="Show photo 3"></button>
        <button class="indicator" type="button" aria-label="Show photo 4"></button>
      </div>
    </section>
  </main>

  <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>
  <script src="script.js"></script>
</body>
</html>
